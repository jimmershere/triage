# Redirect all HTTP to HTTPS
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

# HTTPS vhost
<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile    "/usr/local/apache2/conf/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/server.key"
    # If you have a CA chain:
    # SSLCertificateChainFile "/usr/local/apache2/conf/certs/chain.crt"

    # Proxy setup
    ProxyPreserveHost On
    ProxyTimeout 60

    # API goes to FastAPI
    ProxyPass        /api/ http://api:8000/api/
    ProxyPassReverse /api/ http://api:8000/api/

    # Everything else -> Go frontend
    ProxyPass        / http://frontend_go:8080/
    ProxyPassReverse / http://frontend_go:8080/

    # -------- Basic Auth (file-based) --------
    # Protect the Portal
    <Location "/portal">
        AuthType Basic
        AuthName "Triage Portal"
        AuthBasicProvider file
        AuthUserFile "/usr/local/apache2/conf/auth/portal.htpasswd"
        Require valid-user
    </Location>

    # Protect the Admin
    <Location "/admin">
        AuthType Basic
        AuthName "Triage Admin"
        AuthBasicProvider file
        AuthUserFile "/usr/local/apache2/conf/auth/admin.htpasswd"
        Require valid-user
    </Location>

    # You may also protect entire HTML pages by path if needed:
    <LocationMatch "^/(portal\.html|admin\.html)$">
        AuthType Basic
        AuthName "Triage Protected"
        AuthBasicProvider file
        AuthUserFile "/usr/local/apache2/conf/auth/portal.htpasswd"
        Require valid-user
    </LocationMatch>

    # Optionally lock down the API ingestion to a different user file (writers)
    # <Location "/api/ingest">
    #     AuthType Basic
    #     AuthName "Triage Ingest"
    #     AuthBasicProvider file
    #     AuthUserFile "/usr/local/apache2/conf/auth/writers.htpasswd"
    #     Require valid-user
    # </Location>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
