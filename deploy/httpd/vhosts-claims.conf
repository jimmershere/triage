<VirtualHost *:80>
  ServerName claims.local
  DocumentRoot "/var/www/html"
  ProxyPass "/" "http://127.0.0.1:8080/"
  ProxyPassReverse "/" "http://127.0.0.1:8080/"
</VirtualHost>

<VirtualHost *:443>
  ServerName claims.local
  SSLEngine on
  SSLCertificateFile "/etc/ssl/certs/claims.crt"
  SSLCertificateKeyFile "/etc/ssl/private/claims.key"
  Include conf/extra/ssl.conf
  ProxyPass "/" "http://127.0.0.1:8080/"
  ProxyPassReverse "/" "http://127.0.0.1:8080/"
</VirtualHost>
