# Strict TLS (1.2/1.3 only)
SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite          TLSv1.2 HIGH:!aNULL:!MD5:!3DES:!RC4
SSLHonorCipherOrder     On
SSLCompression          Off
SSLSessionTickets       Off

# HSTS (enable after you confirm HTTPS works)
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

# OCSP stapling (optional if you have a real cert with OCSP)
SSLUseStapling          On
SSLStaplingResponderTimeout 5
SSLStaplingReturnResponderErrors Off
SSLStaplingCache        shmcb:/usr/local/apache2/logs/ssl_stapling(32768)
