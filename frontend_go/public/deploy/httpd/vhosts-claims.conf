
# Multi-tenant portals via name-based vhosts
<VirtualHost *:443>
  ServerName portal1.triage-portal.local
  DocumentRoot "/var/www/triage-portal/public"
  ErrorLog logs/portal1_error.log
  CustomLog logs/portal1_access.log combined

  SSLEngine on
  SSLCertificateFile /etc/pki/tls/certs/portal1.crt
  SSLCertificateKeyFile /etc/pki/tls/private/portal1.key

  # OIDC or LDAP protection is included from separate files:
  IncludeOptional conf.d/oidc.conf
  # or
  # IncludeOptional conf.d/ldap.conf
</VirtualHost>

<VirtualHost *:443>
  ServerName portal2.triage-portal.local
  DocumentRoot "/var/www/triage-portal/public"
  ErrorLog logs/portal2_error.log
  CustomLog logs/portal2_access.log combined

  SSLEngine on
  SSLCertificateFile /etc/pki/tls/certs/portal2.crt
  SSLCertificateKeyFile /etc/pki/tls/private/portal2.key
</VirtualHost>
