<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Triage — Claims Operations Platform">
  <defs>
    <linearGradient id="t-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="55%"  stop-color="#0e4d63"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="50%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0fdff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="t-chipHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer badge -->
  <circle cx="128" cy="104" r="80" fill="url(#t-badge)"/>
  <circle cx="128" cy="104" r="80" fill="url(#t-glow)"/>
  <circle cx="128" cy="104" r="80" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.32"/>

  <!-- Concentric SNIP-tier rings -->
  <circle cx="128" cy="104" r="64" fill="none" stroke="#67e8f9" stroke-width="0.8" stroke-opacity="0.28"/>
  <circle cx="128" cy="104" r="48" fill="none" stroke="#67e8f9" stroke-width="0.6" stroke-opacity="0.42" stroke-dasharray="2 4"/>

  <!-- T mark: crossbar is the triage-priority spectrum -->
  <rect x="80"  y="60" width="24" height="14" rx="3" fill="#dc2626"/>
  <rect x="104" y="60" width="24" height="14" rx="3" fill="#f59e0b"/>
  <rect x="128" y="60" width="24" height="14" rx="3" fill="#06b6d4"/>
  <rect x="152" y="60" width="24" height="14" rx="3" fill="#10b981"/>
  <rect x="80"  y="60" width="96" height="14" rx="3" fill="url(#t-chipHi)"/>

  <!-- Stem -->
  <rect x="121" y="78" width="14" height="68" rx="3" fill="url(#t-stem)"/>
  <line x1="128" y1="84" x2="128" y2="140" stroke="#155e75" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Apex spark -->
  <circle cx="128" cy="54" r="2.5" fill="#fef3c7"/>
  <circle cx="128" cy="54" r="7"   fill="#fef3c7" opacity="0.28"/>

  <!-- Pulse echo at the foot of the T -->
  <rect x="92"  y="152" width="72" height="3" rx="1.5" fill="#22d3ee" opacity="0.55"/>
  <rect x="100" y="158" width="56" height="2" rx="1"   fill="#22d3ee" opacity="0.32"/>

  <!-- Wordmark -->
  <text x="128" y="212" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="34" font-weight="800" letter-spacing="8" fill="#0f172a">TRIAGE</text>
  <text x="128" y="234" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="3.8" fill="#475569">CLAIMS OPERATIONS PLATFORM</text>
</svg>
