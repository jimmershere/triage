<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Alert1 — Supervised swarm escalation">
  <defs>
    <!-- Amber hub -->
    <radialGradient id="a1-hub" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fef3c7"/>
      <stop offset="45%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <!-- Hub highlight ring -->
    <linearGradient id="a1-hub-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Satellite gradient -->
    <radialGradient id="a1-sat" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="60%"  stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>
  </defs>

  <!-- Ripple rings (alert pulse) -->
  <circle cx="128" cy="100" r="92" fill="none" stroke="#f59e0b" stroke-width="1"   stroke-opacity="0.16"/>
  <circle cx="128" cy="100" r="78" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.30" stroke-dasharray="3 4"/>
  <circle cx="128" cy="100" r="60" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.50"/>
  <circle cx="128" cy="100" r="44" fill="none" stroke="#fde68a" stroke-width="1"   stroke-opacity="0.55"/>

  <!-- Connector lines hub -> satellites -->
  <g stroke="#0e7490" stroke-width="1.5" stroke-opacity="0.55">
    <line x1="128" y1="100" x2="128" y2="25"/>
    <line x1="128" y1="100" x2="199" y2="77"/>
    <line x1="128" y1="100" x2="172" y2="161"/>
    <line x1="128" y1="100" x2="84"  y2="161"/>
    <line x1="128" y1="100" x2="57"  y2="77"/>
  </g>

  <!-- 5 satellite agents -->
  <g>
    <circle cx="128" cy="25"  r="11" fill="url(#a1-sat)"/>
    <circle cx="199" cy="77"  r="11" fill="url(#a1-sat)"/>
    <circle cx="172" cy="161" r="11" fill="url(#a1-sat)"/>
    <circle cx="84"  cy="161" r="11" fill="url(#a1-sat)"/>
    <circle cx="57"  cy="77"  r="11" fill="url(#a1-sat)"/>
  </g>
  <!-- Tiny status pip on each satellite -->
  <g fill="#22d3ee">
    <circle cx="128" cy="25"  r="2.5"/>
    <circle cx="199" cy="77"  r="2.5"/>
    <circle cx="172" cy="161" r="2.5"/>
    <circle cx="84"  cy="161" r="2.5"/>
    <circle cx="57"  cy="77"  r="2.5"/>
  </g>

  <!-- Hub aura -->
  <circle cx="128" cy="100" r="34" fill="#f59e0b" opacity="0.18"/>
  <!-- Hub -->
  <circle cx="128" cy="100" r="28" fill="url(#a1-hub)"/>
  <circle cx="128" cy="100" r="28" stroke="url(#a1-hub-ring)" stroke-width="2"/>

  <!-- Stylized "1" — single supervisor verdict -->
  <g stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M118 92 L128 86 L128 118"/>
    <line x1="120" y1="118" x2="138" y2="118"/>
  </g>

  <!-- Wordmark -->
  <text x="128" y="212" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="34" font-weight="800" letter-spacing="6" fill="#0f172a">ALERT1</text>
  <text x="128" y="234" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="3.4" fill="#475569">SUPERVISED CLAIM SWARMS</text>
</svg>
