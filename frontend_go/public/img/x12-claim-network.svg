<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">X12 claim processing network</title>
  <desc id="desc">A medical claim processing network connecting X12 claim, payer, validation, payment, and lineage nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fdf4ff"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
    <linearGradient id="claim" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="pay" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="720" height="420" rx="34" fill="url(#bg)"/>
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity=".42">
    <path d="M180 206L324 118M180 206l144 96M396 118l150 88M396 302l150-96M324 118l72 184M324 302l72-184"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="180" cy="206" r="70" fill="#fff"/>
    <circle cx="360" cy="104" r="58" fill="#fff"/>
    <circle cx="360" cy="318" r="58" fill="#fff"/>
    <circle cx="560" cy="206" r="70" fill="#fff"/>
  </g>
  <circle cx="180" cy="206" r="46" fill="url(#claim)"/>
  <circle cx="360" cy="104" r="34" fill="#2563eb"/>
  <circle cx="360" cy="318" r="34" fill="#f59e0b"/>
  <circle cx="560" cy="206" r="46" fill="url(#pay)"/>
  <g fill="#0f172a" font-family="Inter, Segoe UI, Arial" text-anchor="middle" font-weight="800">
    <text x="180" y="304" font-size="22">X12 837</text>
    <text x="360" y="185" font-size="18">Validate</text>
    <text x="360" y="396" font-size="18">Claimtrace</text>
    <text x="560" y="304" font-size="22">835 Pay</text>
  </g>
  <g fill="#fff" font-family="Inter, Segoe UI, Arial" text-anchor="middle" font-weight="900">
    <text x="180" y="214" font-size="28">837</text>
    <text x="360" y="112" font-size="20">SNIP</text>
    <text x="360" y="326" font-size="19">TRACE</text>
    <text x="560" y="214" font-size="28">835</text>
  </g>
  <g transform="translate(88 48)">
    <rect width="206" height="48" rx="16" fill="#0f172a" opacity=".88"/>
    <text x="20" y="31" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial" font-size="18" font-weight="800">medical claim lineage</text>
  </g>
</svg>
