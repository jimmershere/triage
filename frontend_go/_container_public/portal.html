<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" type="image/png" href="/img/hedi-logo.png"/>
  <title>HEDI — Claims Portal</title>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <script src="/config.js"></script>
</head>
<body>
<header class="site-header">
  <a href="/" class="brand"><img src="/img/hedi-logo.png" width="32" height="32" alt="HEDI"><span>HEDI</span></a>
  <nav class="nav">
    <a href="/portal.html" aria-current="page">Portal</a>
    <a href="/edi-mapping.html">HEDI Mapping</a>
    <a href="/claim-entry.html">Claim Entry</a>
    <a href="/logout">Logout</a>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h2>Submit X12 Files</h2>
    <p>Upload one or many X12 files for fast queueing and processing. Real-time status shown below.</p>
    <form id="uploadForm" enctype="multipart/form-data" method="post">
      <input type="file" id="file" name="file" multiple required>
      <div style="margin-top:1rem;">
        <button type="submit">Submit Files</button>
      </div>
    </form>
    <div id="result" class="card" style="margin-top:12px;display:none;"></div>
  </div>

  <div class="card" style="margin-top:24px;">
    <h3>Recent Activity</h3>
    <table>
      <thead>
        <tr><th>File</th><th>Status</th><th>Queued</th></tr>
      </thead>
      <tbody id="activityRows">
        <tr><td>example_837_01.txt</td><td>Queued</td><td>Just now</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const INGEST_URL = window.HEDI_INGEST_URL || "/ingest";

document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const files = document.getElementById("file").files;
  if (!files.length) return;
  const form = new FormData();
  form.append("file", files[0]); // first only for now
  const res = await fetch(INGEST_URL, { method: "POST", body: form });
  const box = document.getElementById("result");
  box.style.display = "block";
  box.textContent = res.ok ? "File queued successfully." : ("Failed: " + await res.text());
});
</script>
</body>
</html>
