version: "3.8"

volumes:
  pgdata:
  archive:
  rabbitmq_data:
  ldap_data:
  ldap_config:

networks:
  default:
    name: turboedi-starter_default

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: turboedi-starter_postgres_1
    environment:
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
      POSTGRES_DB: edi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    container_name: turboedi-starter_rabbitmq_1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Create the exact creds your API/Worker expect
      RABBITMQ_DEFAULT_USER: ediapp
      RABBITMQ_DEFAULT_PASS: 3wm078uu
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:Z,rw

  api:
    # If you build locally:
    build:
      context: ./api
      dockerfile: Dockerfile
    # Or, if already built: image: turboedi-starter_api
    container_name: turboedi-starter_api_1
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/edi
      RABBITMQ_URL: amqp://ediapp:3wm078uu@rabbitmq:5672/
      RMQ_QUEUE: ${RMQ_QUEUE:-edi_files}
      ARCHIVE_DIR: /archive
      HEDI_SHARED_SECRET: turbohedi-shared-secret
    ports:
      - "8000:8000"
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ldap:
        condition: service_healthy
    restart: unless-stopped
    # NOTE: make sure requirements include: fastapi, uvicorn, pika, python-dotenv, pydantic, python-multipart

  worker_py:
    build:
      context: ./worker_py
      dockerfile: Dockerfile
    # Or: image: turboedi-starter_worker_py
    container_name: turboedi-starter_worker_py_1
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/edi
      RMQ_HOST: ${RMQ_HOST:-rabbitmq}
      RMQ_PORT: "${RMQ_PORT:-5672}"
      RMQ_USER: ${RMQ_USER:-ediapp}
      RMQ_PASS: ${RMQ_PASS:-3wm078uu}
      RMQ_VHOST: ${RMQ_VHOST:-/}
      RMQ_QUEUE: ${RMQ_QUEUE:-edi_files}
      RMQ_ACKS_QUEUE: ${RMQ_ACKS_QUEUE:-acks}
      ARCHIVE_DIR: /archive
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend_go:
    build:
      context: ./frontend_go
    environment:
      HEDI_API_BASE: http://api:8000
      HEDI_SESSION_SECRET: ${HEDI_SESSION_SECRET:-HediMAsonarySCRewBitSEMINar3194}
      HEDI_SHARED_SECRET: ${HEDI_SHARED_SECRET:-turbohedi-shared-secret}
      HEDI_OAUTH2_PROXY_URL: ${HEDI_OAUTH2_PROXY_URL:-http://rbac:4180}
      HEDI_OAUTH2_START: ${HEDI_OAUTH2_START:-/oauth2/start}
      # LDAP_URL: ldap://ldap:389
      # LDAP_BASE_DN: dc=example,dc=org
      # LDAP_USER_ATTR: uid
      # LDAP_BIND_DN: cn=readonly,dc=example,dc=org
      # LDAP_BIND_PASS: secret
      CERT_FILE: /app/turbohedi0.1/deploy/httpd/certs/server.crt
      KEY_FILE: /app/turbohedi0.1/deploy/httpd/certs/server.key
    volumes:
      - ./frontend_go/public:/app/public:Z
      - ./deploy/httpd/certs:/app/turbohedi0.1/deploy/httpd/certs:Z,ro
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped

  rbac:
    build:
      context: ./rbac_proxy
    container_name: turboedi-starter_rbac_1
    env_file:
      - ./.env
    environment:
      RBAC_API_BASE: http://api:8000
      RBAC_SHARED_SECRET: ${HEDI_SHARED_SECRET:-turbohedi-shared-secret}
      HEDI_SESSION_SECRET: ${HEDI_SESSION_SECRET:-change-me-in-prod}
    ports:
      - "4180:4180"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ldap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: turboedi-starter_ldap_1
    environment:
      LDAP_ORGANISATION: "TurboHEDI"
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: 3wm078uu
      LDAP_CONFIG_PASSWORD: 3wm078uu
      LDAP_TLS: "${LDAP_TLS:-true}"
      LDAP_TLS_CRT_FILENAME: "${LDAP_TLS_CRT_FILENAME:-ldap.crt}"
      LDAP_TLS_KEY_FILENAME: "${LDAP_TLS_KEY_FILENAME:-ldap.key}"
      LDAP_TLS_CA_CRT_FILENAME: "${LDAP_TLS_CA_CRT_FILENAME:-ca.crt}"
    ports:
      - "${LDAP_HOST_PORT:-3389}:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ${LDAP_TLS_CERT_PATH:-./deploy/httpd/certs/server.crt}:/container/service/slapd/assets/certs/${LDAP_TLS_CRT_FILENAME:-ldap.crt}:Z
      - ${LDAP_TLS_KEY_PATH:-./deploy/httpd/certs/server.key}:/container/service/slapd/assets/certs/${LDAP_TLS_KEY_FILENAME:-ldap.key}:Z
      - ${LDAP_TLS_CA_PATH:-./deploy/httpd/certs/server.crt}:/container/service/slapd/assets/certs/${LDAP_TLS_CA_CRT_FILENAME:-ca.crt}:Z
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://localhost -D "cn=admin,dc=example,dc=com" -w "$$LDAP_ADMIN_PASSWORD" -b "dc=example,dc=com" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

