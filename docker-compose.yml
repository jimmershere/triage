version: "3.8"

volumes:
  pgdata:
  archive:
  rabbitmq_data:

networks:
  default:
    name: turboedi-starter_default

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: turboedi-starter_postgres_1
    environment:
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
      POSTGRES_DB: edi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    container_name: turboedi-starter_rabbitmq_1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Create the exact creds your API/Worker expect
      RABBITMQ_DEFAULT_USER: ediapp
      RABBITMQ_DEFAULT_PASS: 3wm078uu
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:Z,rw

  api:
    # If you build locally:
    build:
      context: ./api
      dockerfile: Dockerfile
    # Or, if already built: image: turboedi-starter_api
    container_name: turboedi-starter_api_1
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/edi
      RMQ_HOST: rabbitmq
      RMQ_PORT: "5672"
      RMQ_USER: ediapp
      RMQ_PASS: 3wm078uu
      ARCHIVE_DIR: /archive
    ports:
      - "8000:8000"
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    # NOTE: make sure requirements include: fastapi, uvicorn, pika, python-dotenv, pydantic, python-multipart

  worker_py:
    build:
      context: ./worker_py
      dockerfile: Dockerfile
    # Or: image: turboedi-starter_worker_py
    container_name: turboedi-starter_worker_py_1
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/edi
      RMQ_HOST: rabbitmq
      RMQ_PORT: "5672"
      RMQ_USER: ediapp
      RMQ_PASS: 3wm078uu
      ARCHIVE_DIR: /archive
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend_go:
    build:
      context: ./frontend_go
    environment:
      INGEST_URL: http://api:8000/ingest
      HEDI_SESSION_SECRET: "HediMAsonarySCRewBitSEMINar3194"
      # LDAP_URL: ldap://ldap:389
      # LDAP_BASE_DN: dc=example,dc=org
      # LDAP_USER_ATTR: uid
      # LDAP_BIND_DN: cn=readonly,dc=example,dc=org
      # LDAP_BIND_PASS: secret
      CERT_FILE: /app/turbohedi0.1/deploy/httpd/certs/server.crt
      KEY_FILE: /app/turbohedi0.1/deploy/httpd/certs/server.key
    volumes:
      - ./frontend_go/public:/app/public:Z
      - ./frontend_go/auth:/app/auth:Z
      - ./deploy/httpd/certs:/app/turbohedi0.1/deploy/httpd/certs:Z,ro
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped

