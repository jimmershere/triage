version: "3.8"

volumes:
  pgdata:
  archive:
  rabbitmq_data:
  ldap_data:
  ldap_config:

networks:
  default:
    name: ${TRIAGE_COMPOSE_NETWORK:-triage_default}

services:
  postgres:
    image: ${TRIAGE_POSTGRES_IMAGE:-docker.io/library/postgres:16}
    container_name: ${TRIAGE_POSTGRES_CONTAINER:-triage_postgres_1}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edi}
      POSTGRES_DB: ${POSTGRES_DB:-edi}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/certs:/etc/postgresql/certs:ro
    command:
      - postgres
      - "-c"
      - config_file=/etc/postgresql/postgresql.conf
      - "-c"
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: ${TRIAGE_RABBITMQ_IMAGE:-docker.io/library/rabbitmq:3-management}
    container_name: ${TRIAGE_RABBITMQ_CONTAINER:-triage_rabbitmq_1}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-15673}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-35672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ediapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-3wm078uu}
      RABBITMQ_DEFAULT_VHOST: ${RMQ_VHOST:-/}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:Z,rw

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ${TRIAGE_API_CONTAINER:-triage_api_1}
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://edi:edi@postgres:5432/edi?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://ediapp:3wm078uu@rabbitmq:5672/}
      RMQ_QUEUE: ${RMQ_QUEUE:-edi_files}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/archive}
      TRIAGE_SHARED_SECRET: ${TRIAGE_SHARED_SECRET:-change-me}
      TRIAGE_CORS_ORIGINS: "${TRIAGE_CORS_ORIGINS:-*}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ldap:
        condition: service_healthy
    restart: unless-stopped

  worker_py:
    build:
      context: ./worker_py
      dockerfile: Dockerfile
    container_name: ${TRIAGE_WORKER_CONTAINER:-triage_worker_py_1}
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://edi:edi@postgres:5432/edi?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://ediapp:3wm078uu@rabbitmq:5672/}
      RMQ_HOST: ${RMQ_HOST:-rabbitmq}
      RMQ_PORT: "${RMQ_PORT:-5672}"
      RMQ_USER: ${RMQ_USER:-ediapp}
      RMQ_PASS: ${RMQ_PASS:-3wm078uu}
      RMQ_VHOST: ${RMQ_VHOST:-/}
      RMQ_QUEUE: ${RMQ_QUEUE:-edi_files}
      RMQ_ACKS_QUEUE: ${RMQ_ACKS_QUEUE:-acks}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/archive}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      TURBO_PIPELINE_ENABLED: ${TURBO_PIPELINE_ENABLED:-1}
    volumes:
      - archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend_go:
    build:
      context: ./frontend_go
    container_name: ${TRIAGE_FRONTEND_CONTAINER:-triage_frontend_go_1}
    environment:
      TRIAGE_API_BASE: ${TRIAGE_API_BASE:-http://api:8000}
      TRIAGE_SESSION_SECRET: ${TRIAGE_SESSION_SECRET:-change-me-in-prod}
      TRIAGE_SHARED_SECRET: ${TRIAGE_SHARED_SECRET:-change-me}
      TRIAGE_OAUTH2_PROXY_URL: ${TRIAGE_OAUTH2_PROXY_URL:-http://rbac:4180}
      TRIAGE_OAUTH2_PROXY_INTERNAL_URL: ${TRIAGE_OAUTH2_PROXY_INTERNAL_URL:-http://rbac:4180}
      TRIAGE_OAUTH2_START: ${TRIAGE_OAUTH2_START:-/oauth2/start}
      CERT_FILE: /app/triage/deploy/httpd/certs/server.crt
      KEY_FILE: /app/triage/deploy/httpd/certs/server.key
    volumes:
      - ./frontend_go/public:/app/public:Z
      - ./deploy/httpd/certs:/app/triage/deploy/httpd/certs:Z,ro
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:8080"
      - "${FRONTEND_HTTPS_PORT:-8443}:8443"
    restart: unless-stopped

  rbac:
    build:
      context: ./rbac_proxy
    container_name: ${TRIAGE_RBAC_CONTAINER:-triage_rbac_1}
    env_file:
      - ./.env
    environment:
      RBAC_API_BASE: ${RBAC_API_BASE:-http://api:8000}
      RBAC_SHARED_SECRET: ${TRIAGE_SHARED_SECRET:-change-me}
      TRIAGE_SESSION_SECRET: ${TRIAGE_SESSION_SECRET:-change-me-in-prod}
      RBAC_COOKIE_SECURE: ${RBAC_COOKIE_SECURE:-false}
    ports:
      - "${RBAC_PORT:-4180}:4180"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ldap:
    image: ${TRIAGE_LDAP_IMAGE:-docker.io/osixia/openldap:1.5.0}
    container_name: ${TRIAGE_LDAP_CONTAINER:-triage_ldap_1}
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION:-Triage}"
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-3wm078uu}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-3wm078uu}
      LDAP_TLS: "${LDAP_TLS:-true}"
      LDAP_TLS_CRT_FILENAME: "${LDAP_TLS_CRT_FILENAME:-ldap.crt}"
      LDAP_TLS_KEY_FILENAME: "${LDAP_TLS_KEY_FILENAME:-ldap.key}"
      LDAP_TLS_CA_CRT_FILENAME: "${LDAP_TLS_CA_CRT_FILENAME:-ca.crt}"
    ports:
      - "${LDAP_HOST_PORT:-3389}:389"
      - "${LDAP_LDAPS_HOST_PORT:-3636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ${LDAP_TLS_CERT_PATH:-./deploy/httpd/certs/server.crt}:/container/service/slapd/assets/certs/${LDAP_TLS_CRT_FILENAME:-ldap.crt}:Z
      - ${LDAP_TLS_KEY_PATH:-./deploy/httpd/certs/server.key}:/container/service/slapd/assets/certs/${LDAP_TLS_KEY_FILENAME:-ldap.key}:Z
      - ${LDAP_TLS_CA_PATH:-./deploy/httpd/certs/server.crt}:/container/service/slapd/assets/certs/${LDAP_TLS_CA_CRT_FILENAME:-ca.crt}:Z
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://localhost -D "cn=admin,dc=example,dc=com" -w "$$LDAP_ADMIN_PASSWORD" -b "dc=example,dc=com" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
