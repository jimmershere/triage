# bots/config/routes_x12_addons.ini
# Queues assumed: x12.835.in, x12.271.in, x12.277.in (ingest) and x12.270.out, x12.276.out (builders)

[channel]
type = edi
editype = x12
charset = us-ascii

# --- Inbound 835 ERA ---
[route]
id = x12_835_in
in = in/era/*.x12
grammar = x12/005010X221A1_835
translate = x12/835_to_db
out = queue:rabbitmq://x12.835.in

# --- Inbound 271 Eligibility response ---
[route]
id = x12_271_in
in = in/eligibility/271/*.x12
grammar = x12/005010X279A1_271
translate = x12/271_to_db
out = queue:rabbitmq://x12.271.in

# --- Inbound 277 Claim status response ---
[route]
id = x12_277_in
in = in/claimstatus/277/*.x12
grammar = x12/005010X212_277
translate = x12/277_to_db
out = queue:rabbitmq://x12.277.in

# --- Outbound 270 Eligibility request ---
[route]
id = x12_270_out
in = queue:rabbitmq://x12.270.out
grammar = x12/005010X279A1_270
translate = x12/276_build
out = out/eligibility/270/

# --- Outbound 276 Claim status request ---
[route]
id = x12_276_out
in = queue:rabbitmq://x12.276.out
grammar = x12/005010X212_276
translate = x12/276_build
out = out/claimstatus/276/
